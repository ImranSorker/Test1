[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-service"
version = "0.1.0"
description = "Sandboxed code execution service: run untrusted Python/shell snippets in isolated, resource-limited environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local Agent Stack" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<27",
    "aiofiles>=23.2,<26",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-aiofiles>=23.2",
]

[project.scripts]
sandbox = "sandbox_service.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # Typer requires Depends() calls as argument defaults.

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["uvicorn.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-p no:libtmux`: a globally installed libtmux ships a pytest plugin that
# applies marks to fixtures, which crashes collection under pytest >= 9.
addopts = "-ra -p no:libtmux --cov=sandbox_service --cov-report=term-missing"

[tool.coverage.run]
source = ["sandbox_service"]
